spring.application.name=diccionario-app-servidor

# --- Implementación en ficheros (la de por defecto) ---
# Si es una carpeta del disco que existe, se leen de ahí los <idioma>.txt.
# Si no, se buscan con ese prefijo en el classpath: los de los jars diccionario-es, diccionario-en...
# Para usar otra carpeta sin recompilar: DICCIONARIOS_CARPETA=/ruta/ java -jar ...
diccionarios.carpeta=META-INF/diccionarios/

# --- Implementación en BBDD (perfil de Maven bbdd) ---
# Sin el perfil no hay driver ni JPA en el classpath y esto se ignora.
# En fichero y no en memoria: en memoria la BBDD se vacía en cada arranque y la huella de los
# ficheros no evitaría ninguna recarga.
spring.datasource.url=jdbc:h2:file:./datos/diccionarios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Unas 10000 palabras al cargar: en lotes, no una sentencia por fila.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
